<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kantor RyHanC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{background:#2a1f3d;color:#f6ead2;font-family:"Pixelify Sans",system-ui,sans-serif;line-height:1.4}
body{max-width:980px;margin:0 auto;padding:12px 12px 28px;overflow-x:hidden}
.atas{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
h1{font-size:1.5rem;font-weight:600;color:#ffd9a0}
.status{display:flex;align-items:center;gap:6px;font-size:.85rem}
.titik{width:10px;height:10px;background:#8a8aa3}
.status.hidup .titik{background:#6fe39a}
.status.putus .titik{background:#ff6b6b}
.kotak{background:#1c1838;border:3px solid #0d0a1f;box-shadow:inset 0 0 0 2px #4b3a6e;padding:8px 12px;margin-bottom:10px;font-size:.92rem}
.kotak b{color:#ffb35c;margin-right:8px;font-weight:600}
#adegan{position:relative;border:4px solid #0d0a1f;box-shadow:0 0 0 3px #4b3a6e;margin-top:6px}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.bub{position:absolute;display:none;max-width:46%;background:#fff3d6;color:#2a1f3d;border:3px solid #0d0a1f;box-shadow:3px 3px 0 #0d0a1f;padding:4px 7px;font-size:12px;line-height:1.3;z-index:5}
.papan{position:absolute;background:#1c1838;color:#f6ead2;border:3px solid #0d0a1f;box-shadow:inset 0 0 0 2px #4b3a6e;padding:2px 5px;overflow:hidden;z-index:3;line-height:1.25}
.papan b{display:block;color:#ffb35c;font-weight:600}
.papan span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
h2{font-size:1.1rem;font-weight:600;color:#ffd9a0;margin:14px 0 6px}
.log{background:#1c1838;border:3px solid #0d0a1f;box-shadow:inset 0 0 0 2px #4b3a6e;padding:4px 12px;max-height:320px;overflow-y:auto}
.pesan{padding:7px 0;border-bottom:2px solid #2e2750;font-size:.9rem}
.pesan:last-child{border-bottom:0}
.pesan b{font-weight:600;margin-right:6px;color:var(--w,#f6ead2)}
.pesan time{float:right;font-size:.72rem;color:#9c92c4}
.kosong{padding:12px 0;color:#9c92c4}
#formPerintah{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#formPerintah input{font:inherit;color:#f6ead2;background:#0d0a1f;border:3px solid #4b3a6e;padding:5px 8px;min-width:0}
#inTeks{flex:1 1 220px}
#inKode{flex:0 1 110px}
#formPerintah button{font:inherit;font-weight:600;color:#2a1f3d;background:#ffb35c;border:3px solid #0d0a1f;box-shadow:3px 3px 0 #0d0a1f;padding:5px 14px;cursor:pointer}
#formPerintah button:disabled{opacity:.5}
#infoKirim{flex:1 0 100%;font-size:.8rem;color:#9c92c4}
</style>
</head>
<body>
<div class="atas">
  <h1>Kantor RyHanC</h1>
  <div class="status" id="status"><span class="titik"></span><span id="statusTeks">Menyambung</span></div>
</div>
<div class="kotak"><b id="tugasLabel">Tugas</b><span id="tugasTeks">Belum ada tugas hari ini.</span></div>
<form class="kotak" id="formPerintah" autocomplete="off">
  <b>Perintah</b>
  <input id="inTeks" placeholder="Tulis perintah untuk tim" maxlength="400" required>
  <input id="inKode" type="password" placeholder="Kode" maxlength="60" required>
  <button id="tombolKirim" type="submit">Kirim</button>
  <div id="infoKirim">Tim bekerja di Discord. Aksi berisiko tetap menunggu persetujuanmu di sana.</div>
</form>
<div id="adegan">
  <canvas id="kanvas" width="256" height="142"></canvas>
  <div class="papan" id="papan"><b>Keputusan tim</b><span id="papanTeks">Belum ada keputusan.</span></div>
</div>
<h2>Obrolan terbaru</h2>
<div class="log" id="log" aria-live="polite"><div class="kosong" id="kosong">Menunggu obrolan pertama dari bot.</div></div>

<script src="konfig.js"></script>
<script>
const LEBAR = 256;
const RUANG = {
  m: { x: 0, y: 0, w: 84, h: 92 },
  t: { x: 84, y: 0, w: 88, h: 92 },
  s: { x: 172, y: 0, w: 84, h: 92 },
  e: { x: 0, y: 92, w: 256, h: 50 },
  b: { x: 0, y: 142, w: 256, h: 50 }
};
const RUMAH = { m: [42, 76], s: [214, 76], e: [128, 128] };
const KURSI = [[100, 70], [156, 70], [128, 86], [96, 56], [160, 56], [110, 88], [146, 88]];
const RAMBUT = ["#4a2c1a", "#1b1b2a", "#8a8aa3", "#7a3b1d", "#2b2b55", "#a8742a"];
const AGEN = {
  pranowo: { nama: "Pranowo", warna: "#e8a317", ruang: "m", kursi: 0, rambut: RAMBUT[0] },
  manager: { nama: "Manager", warna: "#2f9e6f", ruang: "s", kursi: 1, rambut: RAMBUT[1] },
  chatai: { nama: "Chat AI", warna: "#3b82c4", ruang: "e", kursi: 2, rambut: RAMBUT[2] }
};
const BATAS_GELEMBUNG = 25000;
const BATAS_BICARA = 6000;
const LAMA_DI_RAPAT = 15000;
const KECEPATAN = 46;
const adegan = document.getElementById("adegan");
const kanvas = document.getElementById("kanvas");
const c = kanvas.getContext("2d");
const papan = document.getElementById("papan");
const urutanB = [];
const efek = [];
let menunggu = 0;
let kerja = 0;
const ag = {};
const terbaru = {};
let idTerakhir = 0;

function r(x, y, w, h, warna) {
  c.fillStyle = warna;
  c.fillRect(Math.round(x), Math.round(y), w, h);
}

function tinggiAdegan() { return urutanB.length ? 192 : 142; }

function rumah(k) {
  const a = AGEN[k];
  if (a.ruang === "b") {
    const i = urutanB.indexOf(k);
    return [((i + 1) * LEBAR) / (urutanB.length + 1), RUANG.b.y + 36];
  }
  return RUMAH[a.ruang];
}

function kursi(k) { return KURSI[AGEN[k].kursi % KURSI.length]; }

function buatAgen(k) {
  const el = document.createElement("div");
  el.className = "bub";
  adegan.appendChild(el);
  const h = rumah(k);
  ag[k] = { x: h[0], y: h[1], lokasi: "rumah", pulang: null, sibuk: false, dx: 0, dy: 0, jalan: false, bicara: false, bub: el };
}
for (const k in AGEN) buatAgen(k);

function pastikanAgen(k) {
  if (AGEN[k]) return;
  const n = urutanB.length;
  AGEN[k] = {
    nama: k.charAt(0).toUpperCase() + k.slice(1),
    warna: "hsl(" + (Array.from(k).reduce(function (a, ch) { return a + ch.charCodeAt(0) * 37; }, 0) % 360) + " 55% 52%)",
    ruang: "b",
    kursi: 3 + (n % 4),
    rambut: RAMBUT[(n + 3) % RAMBUT.length]
  };
  urutanB.push(k);
  buatAgen(k);
}

function jendela(x, y) {
  r(x, y, 28, 18, "#3b2a44");
  r(x + 2, y + 2, 24, 5, "#f7d08a");
  r(x + 2, y + 7, 24, 4, "#f2a65a");
  r(x + 2, y + 11, 24, 2, "#e8805a");
  r(x + 11, y + 8, 6, 3, "#fff1b8");
  r(x + 2, y + 13, 24, 3, "#4b7aa6");
  r(x + 13, y + 2, 2, 14, "#3b2a44");
}

function layar(x, y, t) {
  r(x, y, 16, 11, "#0d0a1f");
  r(x + 1, y + 1, 14, 9, "#1f3a5f");
  const w = ["#ffb35c", "#6fe39a", "#ff7eb6", "#9ad1ff"];
  for (let i = 0; i < 4; i++) r(x + 2, y + 2 + i * 2, 3 + ((i * 5 + Math.floor(t / 500)) % 9), 1, w[i]);
  r(x + 6, y + 11, 4, 2, "#0d0a1f");
}

function meja(x, y, w) {
  r(x, y, w, 5, "#c68a56");
  r(x, y, w, 1, "#e0a874");
  r(x, y + 5, w, 5, "#8a5a3b");
  r(x + 2, y + 10, 3, 5, "#5a3a2e");
  r(x + w - 5, y + 10, 3, 5, "#5a3a2e");
}

function tanaman(x, y) {
  r(x, y + 6, 7, 5, "#8a5a3b");
  r(x + 1, y, 5, 6, "#4f9d69");
  r(x - 1, y + 2, 3, 3, "#6dbb82");
  r(x + 5, y + 2, 3, 3, "#6dbb82");
}

function rak(x, y, t) {
  r(x, y, 12, 24, "#2b3350");
  r(x, y, 12, 1, "#4b5a82");
  for (let i = 0; i < 4; i++) {
    r(x + 2, y + 3 + i * 5, 2, 2, (Math.floor(t / 400) + i) % 3 ? "#6fe39a" : "#3b5a49");
    r(x + 5, y + 3 + i * 5, 5, 2, "#3a4570");
  }
}

function kursiMakan(x, y) {
  r(x - 3, y - 3, 6, 3, "#7184b0");
  r(x - 3, y, 6, 5, "#5b6b96");
}

function label(x, y, teks) {
  c.font = "8px 'Pixelify Sans'";
  c.textBaseline = "top";
  const w = Math.ceil(c.measureText(teks).width);
  r(x, y, w + 5, 10, "#fff3d6");
  c.fillStyle = "#2a1f3d";
  c.fillText(teks, x + 2.5, y + 1);
}

function orang(k, t) {
  const a = AGEN[k], s = ag[k];
  const langkah = Math.floor(t / 170) % 2;
  const x = Math.round(s.x);
  const naik = (s.jalan || s.bicara) && langkah ? 1 : 0;
  const y = Math.round(s.y);
  r(x - 5, y - 1, 10, 2, "rgba(0,0,0,.28)");
  r(x - 3, y - 4 - (s.jalan && langkah ? 1 : 0), 2, 4, "#2b2140");
  r(x + 1, y - 4 - (s.jalan && !langkah ? 1 : 0), 2, 4, "#2b2140");
  r(x - 4, y - 11 - naik, 8, 7, a.warna);
  r(x - 4, y - 5 - naik, 8, 1, "rgba(0,0,0,.25)");
  r(x - 5, y - 10 - naik, 1, 5, a.warna);
  r(x + 4, y - 10 - naik, 1, 5, a.warna);
  r(x - 5, y - 6 - naik, 1, 1, "#f1c9a5");
  r(x + 4, y - 6 - naik, 1, 1, "#f1c9a5");
  r(x - 3, y - 18 - naik, 6, 7, "#f1c9a5");
  r(x - 3, y - 19 - naik, 6, 2, a.rambut);
  r(x - 4, y - 18 - naik, 1, 4, a.rambut);
  r(x + 3, y - 18 - naik, 1, 4, a.rambut);
  r(x - 2, y - 15 - naik, 1, 1, "#2b2140");
  r(x + 1, y - 15 - naik, 1, 1, "#2b2140");
  if (s.bicara && langkah) r(x - 1, y - 13 - naik, 2, 1, "#a14a3a");
  if (menunggu && Date.now() - menunggu < 330000 && Math.floor(t / 400) % 2) {
    r(x - 1, y - 28 - naik, 2, 5, "#ff6b6b");
    r(x - 1, y - 22 - naik, 2, 2, "#ff6b6b");
  }
  if (k === "chatai" && kerja && Date.now() - kerja < 90000) {
    const f = Math.floor(t / 250) % 3;
    for (let i = 0; i < 3; i++) r(x - 5 + i * 4, y - 26 - naik - (i === f ? 2 : 0), 2, 2, "#ffd9a0");
  }
  c.font = "8px 'Pixelify Sans'";
  const w = Math.ceil(c.measureText(a.nama).width) + 5;
  label(x - Math.round(w / 2), y + 2, a.nama);
}

function gambar(t) {
  const H = tinggiAdegan();
  if (kanvas.height !== H) kanvas.height = H;
  c.imageSmoothingEnabled = false;
  const M = RUANG.m, T = RUANG.t, S = RUANG.s, E = RUANG.e, B = RUANG.b;
  for (const R of [M, S]) {
    r(R.x, R.y, R.w, 26, "#e9a47c");
    r(R.x, R.y + 22, R.w, 4, "#d68a62");
    r(R.x, R.y + 26, R.w, 2, "#5a3a2e");
    const kayu = R === M;
    for (let i = 0; R.y + 28 + i * 6 < R.h; i++) {
      r(R.x, R.y + 28 + i * 6, R.w, 6, kayu ? (i % 2 ? "#b9794a" : "#c0824f") : (i % 2 ? "#7fb08a" : "#88b993"));
    }
  }
  r(T.x, T.y, T.w, 26, "#e9a47c");
  r(T.x, T.y + 22, T.w, 4, "#d68a62");
  r(T.x, T.y + 26, T.w, 2, "#5a3a2e");
  for (let yy = T.y + 28; yy < T.h; yy += 8) {
    for (let xx = T.x, j = 0; xx < T.x + T.w; xx += 8, j++) r(xx, yy, 8, 8, (j + yy / 8) % 2 ? "#9aa9c9" : "#8e9dc0");
  }
  r(E.x, E.y, E.w, 14, "#667599");
  r(E.x, E.y + 14, E.w, 36, "#c9d0de");
  for (let xx = 0; xx < E.w; xx += 16) r(xx, E.y + 14, 1, 36, "#b6bfd1");
  if (urutanB.length) {
    r(B.x, B.y, B.w, 14, "#d9b98f");
    r(B.x, B.y + 14, B.w, 36, "#e8d9bb");
    for (let i = 0; i < 6; i++) r(B.x, B.y + 14 + i * 6, B.w, 1, "#d6c39f");
    r(10, B.y + 36, 236, 8, "#c68a56");
    r(10, B.y + 44, 236, 4, "#8a5a3b");
    tanaman(238, B.y + 22);
    label(3, B.y + 17, "Ruang Tim Baru");
  }
  jendela(M.x + 28, M.y + 4);
  jendela(S.x + 28, S.y + 4);
  r(T.x + 4, T.y + 6, 3, 16, "#8a5a3b");
  meja(M.x + 14, M.y + 54, 56);
  layar(M.x + 20, M.y + 40, t);
  layar(M.x + 46, M.y + 40, t + 700);
  tanaman(M.x + 70, M.y + 70);
  meja(S.x + 14, S.y + 54, 56);
  layar(S.x + 20, S.y + 40, t + 300);
  layar(S.x + 46, S.y + 40, t + 1100);
  tanaman(S.x + 4, S.y + 70);
  for (let dy = -9; dy <= 9; dy++) {
    const half = Math.round(28 * Math.sqrt(1 - (dy / 10) * (dy / 10)));
    r(128 - half, 66 + dy, half * 2, 1, dy > 6 ? "#8a5a3b" : "#c68a56");
  }
  for (const p of KURSI) kursiMakan(p[0], p[1] - 6);
  tanaman(T.x + 4, T.y + 72);
  const tr = kerja && Date.now() - kerja < 90000 ? t * 3 : t;
  rak(14, E.y + 20, tr);
  rak(30, E.y + 20, tr + 500);
  rak(228, E.y + 20, tr + 900);
  label(M.x + 3, M.y + 3, "Ruang Marketing");
  label(T.x + 3, T.y + 3, "Ruang Rapat");
  label(S.x + 3, S.y + 3, "Software House");
  label(E.x + 3, E.y + 3, "Ruang Eksekutor");
  const urut = Object.keys(AGEN).sort(function (a, b) { return ag[a].y - ag[b].y; });
  for (const k of urut) orang(k, t);
  const kini = Date.now();
  for (let i = efek.length - 1; i >= 0; i--) {
    const e = efek[i];
    const umur = (kini - e.t0) / 1000;
    if (umur > 2.6) {
      efek.splice(i, 1);
      continue;
    }
    if (e.j === "surat") {
      const ex = e.x + umur * 55, ey = e.y - 22 - umur * 10;
      r(ex, ey, 10, 7, "#fff3d6");
      r(ex, ey, 10, 1, "#2a1f3d");
      r(ex, ey + 6, 10, 1, "#2a1f3d");
      r(ex, ey, 1, 7, "#2a1f3d");
      r(ex + 9, ey, 1, 7, "#2a1f3d");
      r(ex + 2, ey + 2, 6, 1, "#c9b48a");
    } else if (e.j === "paket") {
      const ey = e.y - 24 - umur * 16;
      r(e.x - 4, ey, 8, 8, "#c68a56");
      r(e.x - 1, ey, 2, 8, "#e8c08a");
      r(e.x - 4, ey, 8, 1, "#8a5a3b");
    } else {
      for (let n = 0; n < 4; n++) r(e.x - 8 + n * 5, e.y - 24 - umur * 12 - (n % 2) * 4, 2, 2, "#ffd9a0");
    }
  }
}

function langkahkan(dt) {
  const sekarang = Date.now();
  const tunggu = menunggu && sekarang - menunggu < 330000;
  for (const k in AGEN) {
    const s = ag[k];
    let tx, ty;
    if (s.lokasi === "rapat" || tunggu) {
      tx = kursi(k)[0];
      ty = kursi(k)[1];
    } else {
      const h = rumah(k);
      tx = h[0] + (s.sibuk ? s.dx : 0);
      ty = h[1] + (s.sibuk ? s.dy : 0);
    }
    const jarak = Math.hypot(tx - s.x, ty - s.y);
    if (jarak > 0.6) {
      const langkah = Math.min(jarak, KECEPATAN * dt);
      s.x += ((tx - s.x) / jarak) * langkah;
      s.y += ((ty - s.y) / jarak) * langkah;
      s.jalan = true;
    } else {
      s.jalan = false;
    }
    const data = terbaru[k];
    s.bicara = !!data && sekarang - data.waktu < BATAS_BICARA;
  }
}

let terakhirFrame = 0;
function putar(t) {
  if (t - terakhirFrame >= 33) {
    langkahkan(Math.min(0.1, (t - terakhirFrame) / 1000));
    terakhirFrame = t;
    gambar(t);
  }
  requestAnimationFrame(putar);
}

function bicara(k) {
  const s = ag[k];
  s.lokasi = "rapat";
  clearTimeout(s.pulang);
  s.pulang = setTimeout(function () { s.lokasi = "rumah"; }, LAMA_DI_RAPAT);
}

function iseng() {
  const nama = Object.keys(AGEN);
  const k = nama[Math.floor(Math.random() * nama.length)];
  const s = ag[k];
  if (s.lokasi !== "rumah" || s.sibuk || Math.random() > 0.45) return;
  s.sibuk = true;
  s.dx = (Math.random() - 0.5) * 36;
  s.dy = Math.random() * 8 - 3;
  setTimeout(function () { s.sibuk = false; }, 3800);
}

function setStatus(kelas, teks) {
  document.getElementById("status").className = "status " + kelas;
  document.getElementById("statusTeks").textContent = teks;
}

function jam(iso) {
  return new Date(iso).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
}

function terapkan(baris, awal) {
  if (baris.agen === "rian") baris.agen = "pranowo";
  if (!AGEN[baris.agen] && baris.agen !== "sistem" && baris.agen !== "keputusan" && /^[a-z]{3,12}$/.test(baris.agen)) {
    pastikanAgen(baris.agen);
  }
  idTerakhir = Math.max(idTerakhir, baris.id);
  const waktu = Date.parse(baris.dibuat);
  const segar = !awal && Date.now() - waktu < BATAS_GELEMBUNG;
  if (baris.jenis === "tugas") {
    document.getElementById("tugasLabel").textContent = "Tugas";
    document.getElementById("tugasTeks").textContent = baris.teks.replace(/^Tugas dari bos:\s*/, "");
  } else if (baris.jenis === "rutin" && baris.agen === "sistem") {
    document.getElementById("tugasLabel").textContent = "Santai";
    document.getElementById("tugasTeks").textContent = baris.teks.replace(/^Obrolan santai di kantor tentang:\s*/, "");
  } else if (baris.jenis === "approval") {
    document.getElementById("tugasLabel").textContent = "Menunggu";
    document.getElementById("tugasTeks").textContent = "Tim menunggu persetujuanmu di Discord";
  } else if (baris.jenis === "keputusan") {
    document.getElementById("papanTeks").textContent = baris.teks;
  }
  if (baris.jenis === "approval") {
    menunggu = waktu;
  } else if (baris.jenis === "persetujuan") {
    menunggu = 0;
  } else if (baris.jenis === "kerja") {
    kerja = waktu;
  } else if (baris.jenis === "aksi" && baris.agen === "chatai") {
    kerja = 0;
    menunggu = 0;
    if (segar) {
      const p = ag.chatai;
      const j = /email|surat|laporan/i.test(baris.teks) ? "surat" : (/repo|github/i.test(baris.teks) ? "paket" : "kilau");
      efek.push({ j: j, x: p.x, y: p.y, t0: Date.now() });
    }
  }
  if (AGEN[baris.agen]) {
    terbaru[baris.agen] = { teks: baris.teks, waktu: waktu, mulai: segar ? Date.now() : 0 };
    if (segar) bicara(baris.agen);
  }
  const log = document.getElementById("log");
  const kosong = document.getElementById("kosong");
  if (kosong) kosong.remove();
  const dekat = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  const el = document.createElement("div");
  el.className = "pesan";
  const info = AGEN[baris.agen];
  if (info) el.style.setProperty("--w", info.warna);
  const nama = document.createElement("b");
  nama.textContent = info ? info.nama : (baris.agen === "keputusan" ? "Keputusan" : "Sistem");
  const t = document.createElement("time");
  t.textContent = jam(baris.dibuat);
  const isi = document.createElement("span");
  isi.textContent = baris.teks;
  el.append(nama, t, document.createElement("br"), isi);
  log.appendChild(el);
  while (log.children.length > 80) log.removeChild(log.firstChild);
  if (dekat) log.scrollTop = log.scrollHeight;
}

function tampil() {
  const skala = kanvas.clientWidth / LEBAR;
  const sekarang = Date.now();
  let terkini = null;
  for (const k in AGEN) {
    if (terbaru[k] && (terkini === null || terbaru[k].waktu >= terbaru[terkini].waktu)) terkini = k;
  }
  papan.style.left = (RUANG.t.x + 8) * skala + "px";
  papan.style.top = 5 * skala + "px";
  papan.style.width = (RUANG.t.w - 16) * skala + "px";
  papan.style.fontSize = Math.max(9, 3.4 * skala) + "px";
  for (const k in AGEN) {
    const el = ag[k].bub;
    const data = terbaru[k];
    const umur = data ? sekarang - data.waktu : Infinity;
    if (data && k === terkini && umur < BATAS_GELEMBUNG) {
      let teks = data.teks.length > 170 ? data.teks.slice(0, 167) + "..." : data.teks;
      if (data.mulai) {
        const n = Math.max(1, Math.floor((sekarang - data.mulai) / 28));
        if (n < teks.length) teks = teks.slice(0, n);
      }
      if (el.textContent !== teks) el.textContent = teks;
      el.style.display = "block";
      const lebar = el.offsetWidth;
      const tinggi = el.offsetHeight;
      const tengah = Math.min(Math.max(ag[k].x * skala, lebar / 2 + 2), adegan.clientWidth - lebar / 2 - 2);
      el.style.left = tengah - lebar / 2 + "px";
      el.style.top = Math.max(2, (ag[k].y - 26) * skala - tinggi) + "px";
    } else {
      el.style.display = "none";
    }
  }
}

async function ambil(awal) {
  const q = awal ? "order=id.desc&limit=40" : "id=gt." + idTerakhir + "&order=id.asc&limit=100";
  const res = await fetch(KONFIG.url + "/rest/v1/kantor_pesan?select=*&" + q, {
    headers: { apikey: KONFIG.kunci, Authorization: "Bearer " + KONFIG.kunci }
  });
  if (!res.ok) throw new Error("kode " + res.status);
  const baris = await res.json();
  if (awal) baris.reverse();
  baris.forEach(function (b) { terapkan(b, awal); });
}

function siapkanForm() {
  const form = document.getElementById("formPerintah");
  const info = document.getElementById("infoKirim");
  const tombol = document.getElementById("tombolKirim");
  try {
    document.getElementById("inKode").value = localStorage.getItem("kodeKantor") || "";
  } catch (e) {
  }
  form.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    if (typeof KONFIG === "undefined" || !KONFIG.url || !KONFIG.kunci) {
      info.textContent = "Halaman belum diatur, isi konfig.js dulu.";
      return;
    }
    const teks = document.getElementById("inTeks").value.trim();
    const kode = document.getElementById("inKode").value;
    if (teks.length < 3) return;
    try {
      localStorage.setItem("kodeKantor", kode);
    } catch (e) {
    }
    tombol.disabled = true;
    info.textContent = "Mengirim...";
    try {
      const res = await fetch(KONFIG.url + "/rest/v1/kantor_perintah", {
        method: "POST",
        headers: {
          apikey: KONFIG.kunci,
          Authorization: "Bearer " + KONFIG.kunci,
          "Content-Type": "application/json",
          Prefer: "return=minimal"
        },
        body: JSON.stringify({ teks: teks, kode: kode })
      });
      if (res.ok) {
        info.textContent = "Terkirim. Tim mulai bekerja dalam beberapa detik, lihat obrolannya di sini.";
        document.getElementById("inTeks").value = "";
      } else {
        info.textContent = "Gagal mengirim (kode " + res.status + ").";
      }
    } catch (e) {
      info.textContent = "Gagal mengirim, periksa koneksi.";
    }
    tombol.disabled = false;
  });
}

async function mulai() {
  siapkanForm();
  requestAnimationFrame(putar);
  setInterval(tampil, 120);
  setInterval(iseng, 6000);
  if (typeof KONFIG === "undefined" || !KONFIG.url || !KONFIG.kunci) {
    setStatus("putus", "Belum diatur");
    document.getElementById("tugasTeks").textContent = "Buat file konfig.js di folder web berisi alamat Supabase dan kunci anon.";
    return;
  }
  try {
    await ambil(true);
    setStatus("hidup", "Langsung");
  } catch (e) {
    setStatus("putus", "Terputus");
  }
  setInterval(async function () {
    try {
      await ambil(false);
      setStatus("hidup", "Langsung");
    } catch (e) {
      setStatus("putus", "Terputus");
    }
  }, 2500);
}
mulai();
</script>
